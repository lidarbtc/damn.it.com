<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Services running on damn.it.com. Portal tunnel relay and operator contact." />
        <meta name="color-scheme" content="dark" />
        <title>damn.it.com</title>
        <style>
            :root {
                color-scheme: dark;
                background: #242424;
                color: #e0e0e0;
                font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                font-size: 15px;
                line-height: 1.8;
                -webkit-text-size-adjust: 100%;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: clamp(24px, 4vw, 56px);
            }

            main {
                max-width: 64ch;
            }

            h1, h2, h3, p {
                margin: 0;
                font-size: 1rem;
            }

            h1, h2, h3 {
                font-weight: 600;
            }

            header {
                margin-bottom: 4rem;
            }

            h2 {
                margin-bottom: 1.5rem;
            }

            .syntax {
                color: #a0a0a0;
                font-weight: 400;
            }

            .services {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .services li {
                position: relative;
                padding-left: 2ch;
            }

            .services li + li {
                margin-top: 2rem;
            }

            .list-marker {
                position: absolute;
                left: 0;
            }

            .host {
                display: inline-block;
                margin-top: 0.25rem;
            }

            .description {
                margin-top: 1rem;
                color: #c2c2c2;
            }

            .source {
                margin-top: 0.75rem;
                color: #c2c2c2;
            }

            a {
                color: inherit;
                text-decoration-thickness: 1px;
                text-underline-offset: 0.22em;
                overflow-wrap: anywhere;
            }

            a:hover {
                color: #ffffff;
                text-decoration-thickness: 2px;
            }

            a:focus-visible {
                outline: 2px solid #e0e0e0;
                outline-offset: 4px;
            }

            footer {
                margin-top: 3.5rem;
            }

            footer p {
                color: #c2c2c2;
            }

            ::selection {
                background: #e0e0e0;
                color: #242424;
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1><span class="syntax" aria-hidden="true"># </span>damn.it.com</h1>
            </header>

            <section aria-labelledby="services-heading">
                <h2 id="services-heading"><span class="syntax" aria-hidden="true">## </span>Services</h2>
                <ul class="services" role="list">
                    <li>
                        <span class="syntax list-marker" aria-hidden="true">-</span>
                        <h3>Portal</h3>
                        <a class="host" href="https://portal.damn.it.com">portal.damn.it.com</a>
                        <p class="description">A tunnel relay for exposing local services to the internet,
                            without port forwarding or a hosted account.</p>
                        <p class="source">Source: <a href="https://github.com/gosuda/portal-tunnel">gosuda/portal-tunnel</a></p>
                    </li>
                </ul>
            </section>

            <footer aria-labelledby="contact-heading">
                <h2 id="contact-heading"><span class="syntax" aria-hidden="true">## </span>Contact</h2>
                <p>For operator inquiries, contact <a href="https://github.com/lidarbtc">@lidarbtc on GitHub</a>.</p>
            </footer>
        </main>
    </body>
</html>
