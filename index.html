<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>damn.it</title>
        <style>
            @import url(https://fonts.bunny.net/css?family=montserrat:700|noto-sans-kr:400,700);

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            body {
                background-color: #121212;
                color: #e0e0e0;
                font-family: "Noto Sans KR", "Montserrat", sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            .content {
                padding: 20px;
            }

            h1 {
                font-family: "Montserrat", sans-serif;
                font-size: clamp(3rem, 10vw, 8rem);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #ffffff;
                margin: 0;
            }

            p {
                font-size: clamp(1rem, 2.5vw, 1.5rem);
                font-weight: 400;
                color: #a0a0a0;
                margin-top: 15px;
                line-height: 1.6;
            }

            a {
                color: #bb86fc;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <h1>Damn it!</h1>
            <p>이런! 아직 아무런 내용이 없군요.</p>
        </div>
    </body>
</html>
